<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>КРУТЫЕ МЕСТА ЧУВАШИИ</title>

<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffc8">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@latest" defer></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap');
  
  :root {
    --bg-body: #05070a;
    --text-main: #e2e8f0;
    --text-title: #ffffff;
    --text-desc: #94a3b8;
    
    /* КРАСИВЫЙ LIQUID GLASS */
    --glass-opacity: 0.55; 
    --glass-blur: 40px;
    
    --glass-bg: rgba(20, 25, 35, var(--glass-opacity));
    --glass-border: rgba(255, 255, 255, 0.18);
    --glass-highlight: rgba(255, 255, 255, 0.12);
    --input-bg: rgba(0, 0, 0, 0.35);
    --btn-bg: rgba(30, 40, 50, 0.5);
  }

  body.light-theme {
    --bg-body: #e2e8f0;
    --text-main: #1e293b;
    --text-title: #0f172a;
    --text-desc: #475569;
    
    --glass-bg: rgba(255, 255, 255, var(--glass-opacity));
    --glass-border: rgba(0, 0, 0, 0.15);
    --glass-highlight: rgba(255, 255, 255, 0.8);
    --input-bg: rgba(255, 255, 255, 0.6);
    --btn-bg: rgba(255, 255, 255, 0.9);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { 
    font-family: 'Rubik', sans-serif; 
    background: var(--bg-body); 
    color: var(--text-main); 
    font-size: 16px; 
    overflow: hidden;
    transition: background 0.4s, color 0.4s; 
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(0, 255, 200, 0.2) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(255, 0, 102, 0.2) 0%, transparent 40%);
    background-attachment: fixed;
  }
  
  .swipe-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
  .page { width: 100vw; height: 100vh; overflow-y: auto; padding: 20px 15px 80px; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); position: absolute; top: 0; left: 0; background: var(--bg-body); background-image: radial-gradient(circle at 10% 20%, rgba(0, 255, 200, 0.2) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(255, 0, 102, 0.2) 0%, transparent 40%); background-attachment: fixed; }
  #page-main { transform: translateX(0); z-index: 2; }
  #page-quests { transform: translateX(100vw); z-index: 1; }

  .container { max-width: 920px; margin: 0 auto; position: relative; }
  
  /* ШАПКА */
  .top-bar { display: flex; justify-content: flex-start; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  
  .icon-btn { 
    background: var(--glass-bg); border: 1px solid var(--glass-border); 
    color: var(--text-main); width: 45px; height: 45px; 
    display: flex; align-items: center; justify-content: center; 
    cursor: pointer; border-radius: 50%; 
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 15px rgba(0,0,0,0.2);
    transition: all 0.3s;
  }
  .icon-btn:hover { background: var(--input-bg); }
  .icon-btn svg { width: 22px; height: 22px; }

  .avatar { 
    width: 45px; height: 45px; border-radius: 50%; background: #00ffc8; color: #0a0c10; 
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; 
    cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,255,200,0.5); margin-left: auto;
  }
  .avatar.guest { background: #475569; color: #fff; border-color: #94a3b8; box-shadow: none; }

  h1 { font-family: 'Oswald', sans-serif; font-size: 2.4em; text-transform: uppercase; text-align: center; color: var(--text-title); text-shadow: 0 0 20px rgba(0,255,200,0.4); margin-bottom: 5px; letter-spacing: 1px; }
  .subtitle { text-align: center; font-size: 12px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-desc); margin-bottom: 25px; }
  
  /* СТЕКЛО */
  .panel, .place-card, .tabs button, .help-content, .profile-content, .settings-content, .about-content, .quest-card, .user-card { 
    background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 10px 40px rgba(0,0,0,0.3);
    transition: background 0.4s, border 0.4s; border-radius: 20px;
  }
  .panel { padding: 15px; margin-bottom: 15px; }
  
  input, textarea, select { font-family: inherit; font-size: 15px; width: 100%; padding: 14px; border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 10px; background: var(--input-bg); color: var(--text-main); -webkit-appearance: none; transition: all 0.3s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #00ffc8; box-shadow: 0 0 15px rgba(0,255,200,0.3); }
  textarea { resize: vertical; min-height: 70px; }
  
  button { background: var(--btn-bg); color: #00ffc8; border: 1px solid rgba(0,255,200,0.4); border-radius: 12px; font-weight: 600; font-family: 'Oswald', sans-serif; text-transform: uppercase; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; width: 100%; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
  button:active { transform: scale(0.96); }
  button svg { width: 18px; height: 18px; }
  
  .btn-toggle { background: transparent; color: var(--text-desc); border: 1px dashed var(--glass-border); }
  label { font-family: 'Oswald', sans-serif; font-size: 11px; text-transform: uppercase; color: var(--text-desc); display: block; margin-bottom: 6px; letter-spacing: 1px; }
  
  .place-card { border-left: 4px solid #00ffc8; margin-bottom: 20px; overflow: hidden; }
  .place-content { padding: 20px; }
  .place-card h3 { font-family: 'Oswald', sans-serif; font-size: 1.5em; text-transform: uppercase; color: var(--text-title); margin-bottom: 8px; }
  .desc { color: var(--text-desc); font-size: 15px; margin-bottom: 15px; line-height: 1.5; }
  
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
  .actions button { width: auto; padding: 10px 16px; font-size: 13px; margin: 0; }
  .btn-ban { border-color: #ff0066; color: #ff0066; display: none; }
  
  #map { height: 350px; width: 100%; border-radius: 20px; margin-bottom: 15px; border: 1px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 1; }
  
  .comments { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--glass-border); }
  .comment { background: var(--input-bg); padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--glass-border); }
  .comment-author { font-weight: bold; color: #00ffc8; margin-right: 5px; font-size: 12px; cursor: pointer; }
  .del-comment { width: auto; padding: 4px 8px; border: none; background: transparent; color: #ff0066; cursor: pointer; display: none; }
  .del-comment svg { width: 16px; height: 16px; }
  .comment-form { display: flex; gap: 8px; margin-top: 10px; }
  .comment-form input { margin: 0; padding: 12px; }
  .comment-form button { width: auto; padding: 12px 20px; margin: 0; }
  
  .empty { text-align: center; padding: 40px; color: var(--text-desc); text-transform: uppercase; font-family: 'Oswald'; font-size: 1.2em; letter-spacing: 2px; }
  .hidden { display: none !important; }
  
  .status { text-align: center; font-family: 'Oswald'; font-size: 13px; padding: 10px; margin-bottom: 15px; border-radius: 8px; text-transform: uppercase; backdrop-filter: blur(5px); }
  .status.ok { color: #00ffc8; background: rgba(0,255,200,0.1); } 
  .status.error { color: #ff0066; background: rgba(255,0,102,0.1); }

  .help-modal, .profile-modal, .settings-modal, .about-modal, .banlist-modal, .user-info-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1001; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .help-content, .profile-content, .settings-content, .about-content, .banlist-content, .user-info-content { padding: 25px; max-width: 450px; width: 100%; color: var(--text-main); }
  h3 { color: var(--text-title); margin-bottom: 20px; text-align: center; font-family: 'Oswald'; text-transform: uppercase; letter-spacing: 1px; }
  .help-content textarea { width: 100%; height: 150px; margin-bottom: 15px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--glass-border); padding: 12px; font-size: 12px; border-radius: 8px; }

  .user-card { padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .user-card button { width: auto; padding: 6px 12px; font-size: 12px; }
</style>
</head>
<body>

<div class="swipe-container">
  
  <!-- СТРАНИЦА 1: ГЛАВНАЯ -->
  <div class="page" id="page-main">
    <div class="container">
      <div class="top-bar">
        <button class="icon-btn" id="installBtn" title="Установить приложение"><i data-lucide="download"></i></button>
        <button class="icon-btn" id="settingsBtn" title="Настройки"><i data-lucide="settings"></i></button>
        <button class="icon-btn" id="themeToggle" title="Сменить тему"><i data-lucide="moon"></i></button>
        <button class="icon-btn" id="banlistBtn" title="Забаненные" style="display:none;"><i data-lucide="shield-alert"></i></button>
        
        <div class="avatar guest" id="avatarBtn">?</div>
      </div>

      <h1>Крутые места Чувашии</h1>
      <div class="subtitle">Чебоксары · Новочебоксарск · Чувашия</div>

      <div id="status" class="status loading">Загрузка...</div>
      <div class="tabs" id="tabs">
        <button class="active" data-tab="popular"><i data-lucide="flame"></i> Популярное</button>
        <button data-tab="new"><i data-lucide="sparkles"></i> Новое</button>
      </div>
      <div class="panel">
        <input type="text" id="searchInput" placeholder="Поиск по названию...">
      </div>
      <div id="map"></div>

      <div class="panel">
        <button class="btn-toggle" id="toggleForm" type="button"><i data-lucide="plus-circle"></i> Добавить место</button>
        <div id="addForm" class="hidden" style="margin-top:15px;">
          <label>Название *</label><input type="text" id="inName" placeholder="Название">
          <label>Описание *</label><textarea id="inDesc" placeholder="Описание"></textarea>
          <label>Ссылка на фото</label><input type="url" id="inPhotos" placeholder="https://.../image.jpg">
          <div class="form-row">
            <div><label>Город</label><select id="inCity"><option>Чебоксары</option><option>Новочебоксарск</option><option>Чувашия</option></select></div>
            <div><label>Координаты</label><input type="text" id="inCoords" placeholder="56.146, 47.248"></div>
          </div>
          <button id="saveBtn" type="button"><i data-lucide="save"></i> Сохранить</button>
        </div>
      </div>

      <div id="placesList"></div>
    </div>
  </div>

  <!-- СТРАНИЦА 2: КВЕСТЫ -->
  <div class="page" id="page-quests">
    <div class="container">
      <div class="top-bar">
        <button class="icon-btn" id="backBtn" title="Назад"><i data-lucide="arrow-right"></i></button>
      </div>
      <h1>Квесты</h1>
      <div class="subtitle">Проверь свои силы</div>
      <div class="quest-card panel" style="border-left: 4px solid #ffc800;">
        <div style="font-family: 'Oswald'; font-size: 1.2em; color: #ffc800; margin-bottom: 10px;">Найди заброшку</div>
        <p style="color: var(--text-desc); margin-bottom: 15px;">Найди старое здание и сделай фото.</p>
        <button class="btn-toggle" onclick="checkAuthBeforeAction(() => alert('Квест начат!'))">Начать</button>
      </div>
    </div>
  </div>

</div>

<!-- МОДАЛЬНЫЕ ОКНА -->
<div class="settings-modal hidden" id="settingsModal">
  <div class="settings-content">
    <h3>Настройки</h3>
    <label>Прозрачность стекла</label>
    <input type="range" id="glassSlider" min="0.1" max="0.95" step="0.05" value="0.55">
    <label style="margin-top:15px;">Звук</label>
    <div style="display:flex; gap:10px;">
      <button id="soundOnBtn" class="btn-toggle" style="flex:1; border-color:#00ffc8;">Вкл</button>
      <button id="soundOffBtn" class="btn-toggle" style="flex:1; border-color:#ff0066; color:#ff0066;">Выкл</button>
    </div>
    <button id="closeSettingsBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="profile-modal hidden" id="profileModal">
  <div class="profile-content">
    <h3 id="profileTitle">Вход</h3>
    <div id="loginSection">
      <input type="text" id="loginNickname" placeholder="Ник">
      <input type="password" id="loginPassword" placeholder="Пароль">
      <button id="loginBtn" type="button">Войти</button>
      <p style="text-align:center; margin-top:15px; font-size:12px; color:var(--text-desc);">Нет аккаунта? <a href="#" id="showRegisterLink" style="color:#00ffc8;">Регистрация</a></p>
    </div>
    <div id="registerSection" class="hidden">
      <input type="text" id="regNickname" placeholder="Придумайте ник">
      <input type="password" id="regPassword" placeholder="Придумайте пароль">
      <button id="registerBtn" type="button">Зарегистрироваться</button>
      <p style="text-align:center; margin-top:15px; font-size:12px; color:var(--text-desc);">Уже есть аккаунт? <a href="#" id="showLoginLink" style="color:#00ffc8;">Войти</a></p>
    </div>
    <div id="loggedInSection" class="hidden">
      <p id="userGreeting" style="text-align:center; margin-bottom:20px; font-weight:bold; color:#00ffc8;"></p>
      <button id="logoutBtn" type="button" style="border-color: #ff0066; color: #ff0066;">Выйти</button>
    </div>
    <button id="closeProfileBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="user-info-modal hidden" id="userInfoModal">
  <div class="user-info-content">
    <h3 id="infoNickname">Ник</h3>
    <p id="infoStatus" style="text-align:center; margin-bottom:20px;"></p>
    <div id="adminBanControls" class="hidden">
      <p style="text-align:center; margin-bottom:10px; font-size:14px; color:#ff0066;">Модерация:</p>
      <div style="display:flex; flex-direction:column; gap:5px;">
        <button onclick="banUser('day')" class="btn-toggle" style="color:#ffc800; border-color:#ffc800;">Забанить на 1 день</button>
        <button onclick="banUser('week')" class="btn-toggle" style="color:#ff9900; border-color:#ff9900;">Забанить на 1 неделю</button>
        <button onclick="banUser('forever')" class="btn-toggle" style="color:#ff0066; border-color:#ff0066;">Забанить навсегда</button>
      </div>
    </div>
    <button id="closeUserInfoBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="banlist-modal hidden" id="banlistModal">
  <div class="banlist-content">
    <h3>Забаненные</h3>
    <div id="banlistItems" style="max-height: 300px; overflow-y: auto;"></div>
    <button id="closeBanlistBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<script>
// ============================================
// НАСТРОЙКИ APPWRITE
// ============================================
const APPWRITE_ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
const APPWRITE_PROJECT_ID = '6af75290002021ce6c30';
const DATABASE_ID = '6af752b800204637c982'; 
const COLLECTION_ID = '6af754b70031b4620e57'; 

const { Client, Databases, ID, Query } = Appwrite;
const client = new Client().setEndpoint(APPWRITE_ENDPOINT).setProject(APPWRITE_PROJECT_ID);
const databases = new Databases(client);

const ADMIN_PASSWORD = 'SmirnovKirill03@inbox.ry';

let places = [];
let soundEnabled = localStorage.getItem('cheb_sound') !== 'false';
let isLightTheme = localStorage.getItem('cheb_theme') === 'light';
let currentUser = JSON.parse(localStorage.getItem('cheb_current_user') || 'null');
let selectedUserForBan = null; 

const statusEl = document.getElementById('status');
const avatarBtn = document.getElementById('avatarBtn');
const banlistBtn = document.getElementById('banlistBtn');

// === ФУНКЦИИ ПРОВЕРКИ ===
function isAdmin() { return currentUser && currentUser.is_admin === 'true'; }

function updateAvatar() {
  if (currentUser) {
    avatarBtn.classList.remove('guest');
    avatarBtn.innerText = currentUser.nickname.charAt(0).toUpperCase();
    if (isAdmin()) banlistBtn.style.display = 'flex';
  } else {
    avatarBtn.classList.add('guest');
    avatarBtn.innerText = '?';
    banlistBtn.style.display = 'none';
  }
}

// ФУНКЦИЯ ПРОВЕРКИ ПЕРЕД ДЕЙСТВИЕМ
function checkAuthBeforeAction(action) {
  if (!currentUser) {
    alert('Войдите в профиль, чтобы совершить это действие!');
    document.getElementById('profileModal').classList.remove('hidden');
    return;
  }
  if (currentUser.is_banned === 'true' || currentUser.ban_type === 'forever') {
    alert('Вы забанены и не можете совершать действия.');
    return;
  }
  action();
}

// === СВАЙПЫ ===
let startX = 0, startY = 0, isSwiping = false;
document.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; isSwiping = true; }, { passive: true });
document.addEventListener('touchend', e => {
  if (!isSwiping) return;
  const diffX = startX - e.changedTouches[0].clientX;
  const diffY = startY - e.changedTouches[0].clientY;
  if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 70) {
    if (diffX > 0) { document.getElementById('page-main').style.transform = 'translateX(-100vw)'; document.getElementById('page-quests').style.transform = 'translateX(0)'; }
    else { document.getElementById('page-main').style.transform = 'translateX(0)'; document.getElementById('page-quests').style.transform = 'translateX(100vw)'; }
  }
  isSwiping = false;
}, { passive: true });

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('page-main').style.transform = 'translateX(0)';
  document.getElementById('page-quests').style.transform = 'translateX(100vw)';
  playSound('click');
});

// === ЗВУК ===
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function playSound(type) {
  if (!soundEnabled) return;
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  if (type === 'click') { osc.type = 'triangle'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1); }
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

document.addEventListener('click', (e) => {
  if (e.target.closest('button')) playSound('click');
});

// === АВТОРИЗАЦИЯ ===
document.getElementById('avatarBtn').addEventListener('click', () => {
  document.getElementById('profileModal').classList.remove('hidden');
  if (currentUser) {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('registerSection').classList.add('hidden');
    document.getElementById('loggedInSection').classList.remove('hidden');
    document.getElementById('userGreeting').innerText = "Привет, " + currentUser.nickname;
  } else {
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('registerSection').classList.add('hidden');
    document.getElementById('loggedInSection').classList.add('hidden');
  }
});

document.getElementById('showRegisterLink').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('registerSection').classList.remove('hidden');
});

document.getElementById('showLoginLink').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('loginSection').classList.remove('hidden');
  document.getElementById('registerSection').classList.add('hidden');
});

document.getElementById('closeProfileBtn').addEventListener('click', () => {
  document.getElementById('profileModal').classList.add('hidden');
});

// ВХОД
document.getElementById('loginBtn').addEventListener('click', async () => {
  const nick = document.getElementById('loginNickname').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if (!nick || !pass) return;

  if (pass === ADMIN_PASSWORD) {
    currentUser = { nickname: 'Админ', is_admin: 'true', is_banned: 'false' };
    localStorage.setItem('cheb_current_user', JSON.stringify(currentUser));
    updateAvatar();
    document.getElementById('profileModal').classList.add('hidden');
    alert('Добро пожаловать, Админ!');
    render();
    return;
  }

  try {
    const res = await databases.listDocuments(DATABASE_ID, COLLECTION_ID, [Query.equal('city', 'USER_ACCOUNT'), Query.equal('name', nick)]);
    if (res.documents.length === 0) { alert('Пользователь не найден!'); return; }
    const user = res.documents[0];
    if (user.desc !== pass) { alert('Неверный пароль!'); return; }
    if (user.ban_type === 'forever') { alert('Вы забанены навсегда!'); return; }
    
    currentUser = { nickname: user.name, is_admin: 'false', id: user.$id, is_banned: user.is_banned || 'false', ban_type: user.ban_type || 'none' };
    localStorage.setItem('cheb_current_user', JSON.stringify(currentUser));
    updateAvatar();
    document.getElementById('profileModal').classList.add('hidden');
    alert('С возвращением, ' + user.name);
    render();
  } catch(e) { alert('Ошибка входа'); }
});

// РЕГИСТРАЦИЯ
document.getElementById('registerBtn').addEventListener('click', async () => {
  const nick = document.getElementById('regNickname').value.trim();
  const pass = document.getElementById('regPassword').value;
  if (!nick || !pass) return;

  const deviceId = localStorage.getItem('cheb_device_id');
  if (deviceId) { alert('На этом устройстве уже есть аккаунт!'); return; }
  if (pass === ADMIN_PASSWORD) { alert('Этот пароль занят!'); return; }

  try {
    const res = await databases.listDocuments(DATABASE_ID, COLLECTION_ID, [Query.equal('city', 'USER_ACCOUNT'), Query.equal('name', nick)]);
    if (res.documents.length > 0) { alert('Ник занят!'); return; }

    const newUser = await databases.createDocument(DATABASE_ID, COLLECTION_ID, ID.unique(), {
      name: nick, desc: pass, city: 'USER_ACCOUNT', category: 'user', guard: 'false', is_banned: 'false', ban_type: 'none', ban_until: '0'
    });
    
    localStorage.setItem('cheb_device_id', ID.unique());
    currentUser = { nickname: nick, is_admin: 'false', id: newUser.$id, is_banned: 'false', ban_type: 'none' };
    localStorage.setItem('cheb_current_user', JSON.stringify(currentUser));
    updateAvatar();
    document.getElementById('profileModal').classList.add('hidden');
    alert('Успешная регистрация!');
    render();
  } catch(e) { alert('Ошибка регистрации'); }
});

// ВЫХОД
document.getElementById('logoutBtn').addEventListener('click', () => {
  currentUser = null;
  localStorage.removeItem('cheb_current_user');
  updateAvatar();
  document.getElementById('profileModal').classList.add('hidden');
  render();
});

// === МОДЕРАЦИЯ ===
function openUserInfo(nickname, userId, isBanned, banType) {
  selectedUserForBan = userId;
  document.getElementById('infoNickname').innerText = nickname;
  document.getElementById('infoStatus').innerHTML = isBanned === 'true' ? '<span style="color:#ff0066;">Забанен</span>' : '<span style="color:#00ffc8;">Активен</span>';
  
  if (isAdmin()) document.getElementById('adminBanControls').classList.remove('hidden');
  else document.getElementById('adminBanControls').classList.add('hidden');
  
  document.getElementById('userInfoModal').classList.remove('hidden');
}

async function banUser(type) {
  if (!isAdmin() || !selectedUserForBan) return;
  let banUntil = '0';
  if (type === 'day') banUntil = Date.now() + 86400000;
  if (type === 'week') banUntil = Date.now() + 604800000;

  try {
    await databases.updateDocument(DATABASE_ID, COLLECTION_ID, selectedUserForBan, {
      is_banned: 'true', ban_type: type, ban_until: String(banUntil)
    });
    alert('Пользователь забанен!');
    document.getElementById('userInfoModal').classList.add('hidden');
    render();
  } catch(e) { alert('Ошибка бана: ' + e.message); }
}

// === СПИСОК ЗАБАНЕННЫХ ===
document.getElementById('banlistBtn').addEventListener('click', async () => {
  if (!isAdmin()) return;
  document.getElementById('banlistModal').classList.remove('hidden');
  const container = document.getElementById('banlistItems');
  container.innerHTML = 'Загрузка...';
  
  try {
    const res = await databases.listDocuments(DATABASE_ID, COLLECTION_ID, [Query.equal('city', 'USER_ACCOUNT')]);
    const banned = res.documents.filter(u => u.ban_type === 'forever');
    
    if (banned.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:var(--text-desc);">Нет забаненных</p>';
    } else {
      container.innerHTML = banned.map(u => `
        <div class="user-card">
          <span>${u.name}</span>
          <button onclick="unbanUser('${u.$id}')" style="border-color:#00ffc8; color:#00ffc8;">Разбанить</button>
        </div>
      `).join('');
    }
  } catch(e) { container.innerHTML = 'Ошибка загрузки'; }
});

async function unbanUser(userId) {
  if (!isAdmin()) return;
  try {
    await databases.updateDocument(DATABASE_ID, COLLECTION_ID, userId, {
      is_banned: 'false', ban_type: 'none', ban_until: '0'
    });
    alert('Разбанен!');
    document.getElementById('banlistBtn').click();
  } catch(e) { alert('Ошибка'); }
}

// === НАСТРОЙКИ ===
document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.remove('hidden');
});
document.getElementById('closeSettingsBtn').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.add('hidden');
});
document.getElementById('glassSlider').addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--glass-opacity', e.target.value);
  localStorage.setItem('cheb_glass_opacity', e.target.value);
});
document.getElementById('soundOnBtn').addEventListener('click', () => {
  soundEnabled = true; localStorage.setItem('cheb_sound', 'true'); playSound('click');
});
document.getElementById('soundOffBtn').addEventListener('click', () => {
  soundEnabled = false; localStorage.setItem('cheb_sound', 'false');
});
document.getElementById('themeToggle').addEventListener('click', () => {
  isLightTheme = !isLightTheme;
  if (isLightTheme) { document.body.classList.add('light-theme'); document.getElementById('themeToggle').innerHTML = '<i data-lucide="sun"></i>'; localStorage.setItem('cheb_theme', 'light'); }
  else { document.body.classList.remove('light-theme'); document.getElementById('themeToggle').innerHTML = '<i data-lucide="moon"></i>'; localStorage.setItem('cheb_theme', 'dark'); }
  lucide.createIcons(); playSound('click');
});

// === О ПРОЕКТЕ ===
document.getElementById('aboutBtn').addEventListener('click', () => {
  document.getElementById('aboutModal').classList.remove('hidden');
});
document.getElementById('closeAboutBtn').addEventListener('click', () => {
  document.getElementById('aboutModal').classList.add('hidden');
});

// === ЗАГРУЗКА И РЕНДЕР ===
async function loadData() {
  try {
    const response = await databases.listDocuments(DATABASE_ID, COLLECTION_ID);
    places = response.documents.filter(doc => doc.city !== 'USER_ACCOUNT').map(doc => ({
      ...doc, id: doc.$id, likes: parseInt(doc.likes) || 0, is_banned: doc.is_banned === 'true'
    }));
  } catch(e) { console.error(e); }
  render();
}

function render() {
  const list = document.getElementById('placesList');
  if (!list) return;
  list.innerHTML = places.map(p => `
    <div class="place-card">
      <div class="place-content">
        <h3>${p.name}</h3>
        <div class="desc">${p.desc || ''}</div>
      </div>
    </div>
  `).join('');
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

if (isLightTheme) document.body.classList.add('light-theme');
const savedOpacity = localStorage.getItem('cheb_glass_opacity') || '0.55';
document.documentElement.style.setProperty('--glass-opacity', savedOpacity);
document.getElementById('glassSlider').value = savedOpacity;

updateAvatar();
loadData();
</script>
</body>
</html>
