<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>КРУТЫЕ МЕСТА ЧУВАШИИ</title>

<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffc8">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@latest" defer></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap');

  :root {
    --bg-body: #05070a;
    --text-main: #e2e8f0;
    --text-title: #ffffff;
    --text-desc: #94a3b8;
    --glass-opacity: 0.6;
    --glass-blur: 40px;
    --glass-bg: rgba(20, 25, 35, var(--glass-opacity));
    --glass-border: rgba(255, 255, 255, 0.25);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    --input-bg: rgba(0, 0, 0, 0.4);
    --btn-bg: rgba(30, 40, 50, 0.5);
    --modal-bg: #111827; /* Плотный фон для модалки */
  }

  body.light-theme {
    --bg-body: #e2e8f0;
    --text-main: #1e293b;
    --text-title: #0f172a;
    --text-desc: #475569;
    --glass-bg: rgba(255, 255, 255, var(--glass-opacity));
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-highlight: rgba(255, 255, 255, 0.8);
    --input-bg: rgba(255, 255, 255, 0.6);
    --btn-bg: rgba(255, 255, 255, 0.9);
    --modal-bg: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Rubik', sans-serif;
    background: var(--bg-body);
    color: var(--text-main);
    font-size: 16px;
    overflow: hidden;
    transition: background 0.4s, color 0.4s;
    background-image: radial-gradient(circle at 10% 20%, rgba(0, 255, 200, 0.2) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(255, 0, 102, 0.2) 0%, transparent 40%);
    background-attachment: fixed;
  }

  .swipe-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
  .page {
    width: 100vw; height: 100vh; overflow-y: auto; padding: 20px 15px 80px;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    position: absolute; top: 0; left: 0;
    background: var(--bg-body);
    background-image: radial-gradient(circle at 10% 20%, rgba(0, 255, 200, 0.2) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(255, 0, 102, 0.2) 0%, transparent 40%);
    background-attachment: fixed;
  }
  #page-main { transform: translateX(0); z-index: 2; }
  #page-quests { transform: translateX(100vw); z-index: 1; }

  .container { max-width: 920px; margin: 0 auto; position: relative; }

  .top-bar { display: flex; justify-content: flex-start; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }

  .icon-btn {
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    color: var(--text-main); width: 45px; height: 45px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 50%;
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 15px rgba(0,0,0,0.3);
    transition: all 0.3s;
  }
  .icon-btn:hover { background: var(--input-bg); }
  .icon-btn svg { width: 22px; height: 22px; }

  .avatar {
    width: 45px; height: 45px; border-radius: 50%; background: #00ffc8; color: #0a0c10;
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px;
    cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 15px rgba(0,255,200,0.6); margin-left: auto;
  }
  .avatar.guest { background: #475569; color: #fff; border-color: #94a3b8; box-shadow: none; }

  h1 { font-family: 'Oswald', sans-serif; font-size: 2.4em; text-transform: uppercase; text-align: center; color: var(--text-title); text-shadow: 0 0 20px rgba(0,255,200,0.4); margin-bottom: 5px; letter-spacing: 1px; }
  .subtitle { text-align: center; font-size: 12px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-desc); margin-bottom: 25px; }

  .panel, .place-card, .tabs button, .help-content, .profile-content, .settings-content, .about-content, .user-card, .map-modal-content, .quest-card, .detail-content {
    background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 10px 40px rgba(0,0,0,0.4);
    transition: background 0.4s, border 0.4s; border-radius: 20px;
  }
  .panel { padding: 15px; margin-bottom: 15px; }

  input, textarea, select { font-family: inherit; font-size: 15px; width: 100%; padding: 14px; border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 10px; background: var(--input-bg); color: var(--text-main); -webkit-appearance: none; transition: all 0.3s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #00ffc8; box-shadow: 0 0 15px rgba(0,255,200,0.3); }
  textarea { resize: vertical; min-height: 70px; }

  button { background: var(--btn-bg); color: #00ffc8; border: 1px solid rgba(0,255,200,0.4); border-radius: 12px; font-weight: 600; font-family: 'Oswald', sans-serif; text-transform: uppercase; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; width: 100%; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
  button:active { transform: scale(0.96); }
  button svg { width: 18px; height: 18px; }

  .btn-toggle { background: transparent; color: var(--text-desc); border: 1px dashed var(--glass-border); }
  label { font-family: 'Oswald', sans-serif; font-size: 11px; text-transform: uppercase; color: var(--text-desc); display: block; margin-bottom: 6px; letter-spacing: 1px; }

  .place-card { border-left: 4px solid #00ffc8; margin-bottom: 20px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
  .place-card:hover { transform: translateY(-3px); box-shadow: 0 15px 45px rgba(0,255,200,0.2); }
  .photo-container { width: 100%; height: 220px; background: #000; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; border-bottom: 1px solid var(--glass-border); pointer-events: none; }
  .photo-item { flex: 0 0 100%; scroll-snap-align: start; height: 100%; object-fit: cover; }
  .place-content { padding: 20px; }
  .place-card h3 { font-family: 'Oswald', sans-serif; font-size: 1.5em; text-transform: uppercase; color: var(--text-title); margin-bottom: 5px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
  
  .author-badge { display: inline-block; background: rgba(0,255,200,0.1); color: #00ffc8; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 10px; border: 1px solid rgba(0,255,200,0.3); }
  .desc { color: var(--text-main); font-size: 15px; margin-bottom: 15px; line-height: 1.5; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }

  .actions { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--glass-border); }
  .actions button { padding: 8px 12px; font-size: 12px; border-radius: 8px; width: auto; font-family: 'Rubik', sans-serif; font-weight: 500; text-transform: none; letter-spacing: 0.5px; }
  .btn-edit { color: #00ffc8; border-color: #00ffc8; background: rgba(0,255,200,0.05); }
  .btn-delete { color: #ff0066; border-color: #ff0066; background: rgba(255,0,102,0.05); }

  /* Модальное окно подробностей (ИСПРАВЛЕНО) */
  .detail-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .detail-content { padding: 0; max-width: 600px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; background: var(--modal-bg); border: 2px solid var(--glass-border); border-radius: 20px; } /* Плотный фон */
  .detail-header { position: relative; width: 100%; background: var(--input-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 20px 20px 0 0; } /* Убран фиксированный размер */
  .detail-header img { width: 100%; height: auto; max-height: 350px; object-fit: cover; display: none; } /* Скрыто по умолчанию */
  .detail-close { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
  .detail-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
  .detail-body h2 { font-family: 'Oswald'; font-size: 2em; color: var(--text-title); margin-bottom: 10px; }
  .full-desc { font-size: 16px; line-height: 1.6; color: var(--text-main); margin-bottom: 20px; white-space: pre-wrap; }

  .comments { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--glass-border); }
  .comment { background: var(--input-bg); padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--glass-border); }
  .comment > span { flex: 1; word-break: break-word; }
  .del-comment { width: auto; padding: 4px 8px; border: none; background: transparent; color: #ff0066; cursor: pointer; display: inline-flex; }
  .del-comment svg { width: 16px; height: 16px; }
  .comment-form { display: flex; gap: 8px; margin-top: 10px; }
  .comment-form input { margin: 0; padding: 12px; }
  .comment-form button { width: auto; padding: 12px 20px; margin: 0; }

  .empty { text-align: center; padding: 40px; color: var(--text-desc); text-transform: uppercase; font-family: 'Oswald'; font-size: 1.2em; letter-spacing: 2px; }
  .hidden { display: none !important; }

  .status { text-align: center; font-family: 'Oswald'; font-size: 13px; padding: 10px; margin-bottom: 15px; border-radius: 8px; text-transform: uppercase; backdrop-filter: blur(5px); }
  .status.ok { color: #00ffc8; background: rgba(0,255,200,0.1); }
  .status.error { color: #ff0066; background: rgba(255,0,102,0.1); }
  .status.loading { color: var(--text-desc); background: rgba(255,255,255,0.05); }

  .help-modal, .profile-modal, .settings-modal, .about-modal, .banlist-modal, .user-info-modal, .map-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1001; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .help-content, .profile-content, .settings-content, .about-content, .banlist-content, .user-info-content { padding: 25px; max-width: 450px; width: 100%; color: var(--text-main); background: var(--modal-bg); }

  .map-modal-content { width: 100%; height: 100%; padding: 0; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  #map { flex-grow: 1; width: 100%; border-radius: 20px; z-index: 1; }
  .map-close-btn { position: absolute; top: 15px; right: 15px; z-index: 1000; width: 50px; height: 50px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 50%; color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: var(--glass-blur); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

  h3 { color: var(--text-title); margin-bottom: 20px; text-align: center; font-family: 'Oswald'; text-transform: uppercase; letter-spacing: 1px; }
  .help-content textarea { width: 100%; height: 200px; margin-bottom: 15px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--glass-border); padding: 12px; font-size: 12px; border-radius: 8px; font-family: monospace; }

  .user-card { padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: var(--input-bg); border-radius: 12px; }
  .user-card button { width: auto; padding: 6px 12px; font-size: 12px; }

  .help-btn { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: #ff0066; color: #fff; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(255,0,102,0.5); z-index: 1000; cursor: pointer; backdrop-filter: blur(5px); }
  .help-btn svg { width: 28px; height: 28px; }

  .form-row { display: flex; gap: 10px; }
  .form-row > * { flex: 1; }
  #questsBtn { display: none; }
</style>
</head>
<body>

<div class="swipe-container">
  <div class="page" id="page-main">
    <div class="container">
      <div class="top-bar">
        <button class="icon-btn" id="mapBtn" title="Открыть карту"><i data-lucide="map"></i></button>
        <button class="icon-btn" id="installBtn" title="Установить приложение" style="display:none;"><i data-lucide="download"></i></button>
        <button class="icon-btn" id="settingsBtn" title="Настройки"><i data-lucide="settings"></i></button>
        <button class="icon-btn" id="themeToggle" title="Сменить тему"><i data-lucide="moon"></i></button>
        <button class="icon-btn" id="banlistBtn" title="Забаненные" style="display:none;"><i data-lucide="shield-alert"></i></button>
        <button class="icon-btn" id="questsBtn" title="Квесты"><i data-lucide="target"></i></button>
        <div class="avatar guest" id="avatarBtn">?</div>
      </div>

      <h1>Крутые места Чувашии</h1>
      <div class="subtitle">Чебоксары · Новочебоксарск · Чувашия</div>

      <div id="status" class="status loading">Загрузка...</div>
      <div class="tabs" id="tabs" style="display:flex; gap:8px; margin-bottom:15px;">
        <button class="active" data-tab="popular" style="flex:1; border-radius:12px; padding:10px;"><i data-lucide="flame"></i> Популярное</button>
        <button data-tab="new" style="flex:1; border-radius:12px; padding:10px;"><i data-lucide="sparkles"></i> Новое</button>
      </div>
      <div class="panel">
        <input type="text" id="searchInput" placeholder="Поиск по названию..." autocomplete="off">
      </div>

      <div class="panel">
        <button class="btn-toggle" id="toggleForm" type="button"><i data-lucide="plus-circle"></i> Добавить место</button>
        <div id="addForm" class="hidden" style="margin-top:15px;">
          <label>Название *</label><input type="text" id="inName" placeholder="Название" maxlength="100">
          <label>Описание *</label><textarea id="inDesc" placeholder="Описание" maxlength="2000"></textarea>
          <label>Ссылка на фото</label><input type="url" id="inPhotos" placeholder="https://.../image.jpg">
          <div class="form-row">
            <div><label>Город</label><select id="inCity"><option>Чебоксары</option><option>Новочебоксарск</option><option>Чувашия</option></select></div>
            <div><label>Координаты</label><input type="text" id="inCoords" placeholder="Введите координаты Яндекс (например: 56.152594, 47.207843)"></div>
          </div>
          <button id="saveBtn" type="button"><i data-lucide="save"></i> Сохранить</button>
        </div>
      </div>

      <div id="placesList"></div>
    </div>
  </div>

  <div class="page" id="page-quests">
    <div class="container">
      <div class="top-bar">
        <button class="icon-btn" id="backBtn" title="Назад"><i data-lucide="arrow-right"></i></button>
      </div>
      <h1>Квесты</h1>
      <div class="subtitle">Проверь свои силы</div>
      <div class="quest-card panel" style="border-left: 4px solid #ffc800;">
        <div style="font-family: 'Oswald'; font-size: 1.2em; color: #ffc800; margin-bottom: 10px;">Найди заброшку</div>
        <p style="color: var(--text-desc); margin-bottom: 15px;">Найди старое здание и сделай фото.</p>
        <button class="btn-toggle" onclick="checkAuthBeforeAction(() => alert('Квест начат!'))">Начать</button>
      </div>
    </div>
  </div>
</div>

<div class="detail-modal hidden" id="detailModal">
  <div class="detail-content">
    <div class="detail-header" id="detailHeader">
      <img id="detailImg" src="">
      <button class="detail-close" id="closeDetailBtn"><i data-lucide="x"></i></button>
    </div>
    <div class="detail-body">
      <h2 id="detailTitle"></h2>
      <div id="detailAuthor" class="author-badge" style="margin-bottom: 15px;"></div>
      <div id="detailDesc" class="full-desc"></div>
      <div id="detailCoordsBox" style="margin-bottom: 20px; display: none;">
         <button class="btn-toggle" onclick="openMapToPlace()"><i data-lucide="map-pin"></i> Показать на карте</button>
      </div>
      
      <div class="comments" id="detailCommentsSection"></div>
    </div>
  </div>
</div>

<div class="settings-modal hidden" id="settingsModal">
  <div class="settings-content">
    <h3>Настройки</h3>
    <label>Прозрачность стекла</label>
    <input type="range" id="glassSlider" min="0.1" max="0.95" step="0.05" value="0.6">
    <label style="margin-top:15px;">Звук</label>
    <div style="display:flex; gap:10px;">
      <button id="soundOnBtn" class="btn-toggle" style="flex:1; border-color:#00ffc8;">Вкл</button>
      <button id="soundOffBtn" class="btn-toggle" style="flex:1; border-color:#ff0066; color:#ff0066;">Выкл</button>
    </div>
    <button id="closeSettingsBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="profile-modal hidden" id="profileModal">
  <div class="profile-content">
    <h3 id="profileTitle">Вход</h3>
    <div id="loginSection">
      <input type="text" id="loginNickname" placeholder="Ник" autocomplete="username">
      <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
      <button id="loginBtn" type="button">Войти</button>
      <p style="text-align:center; margin-top:15px; font-size:12px; color:var(--text-desc);">Нет аккаунта? <a href="#" id="showRegisterLink" style="color:#00ffc8;">Регистрация</a></p>
    </div>
    <div id="registerSection" class="hidden">
      <input type="text" id="regNickname" placeholder="Придумайте ник" maxlength="30" autocomplete="username">
      <input type="password" id="regPassword" placeholder="Придумайте пароль" autocomplete="new-password">
      <button id="registerBtn" type="button">Зарегистрироваться</button>
      <p style="text-align:center; margin-top:15px; font-size:12px; color:var(--text-desc);">Уже есть аккаунт? <a href="#" id="showLoginLink" style="color:#00ffc8;">Войти</a></p>
    </div>
    <div id="loggedInSection" class="hidden">
      <p id="userGreeting" style="text-align:center; margin-bottom:20px; font-weight:bold; color:#00ffc8;"></p>
      <button id="logoutBtn" type="button" style="border-color: #ff0066; color: #ff0066;">Выйти</button>
    </div>
    <button id="closeProfileBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="user-info-modal hidden" id="userInfoModal">
  <div class="user-info-content">
    <h3 id="infoNickname">Ник</h3>
    <p id="infoStatus" style="text-align:center; margin-bottom:20px;"></p>
    <div id="adminBanControls" class="hidden">
      <p style="text-align:center; margin-bottom:10px; font-size:14px; color:#ff0066;">Модерация:</p>
      <div style="display:flex; flex-direction:column; gap:5px;">
        <button onclick="banUser('day')" class="btn-toggle" style="color:#ffc800; border-color:#ffc800;">Забанить на 1 день</button>
        <button onclick="banUser('week')" class="btn-toggle" style="color:#ff9900; border-color:#ff9900;">Забанить на 1 неделю</button>
        <button onclick="banUser('forever')" class="btn-toggle" style="color:#ff0066; border-color:#ff0066;">Забанить навсегда</button>
      </div>
    </div>
    <button id="closeUserInfoBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="banlist-modal hidden" id="banlistModal">
  <div class="banlist-content">
    <h3>Забаненные</h3>
    <div id="banlistItems" style="max-height: 300px; overflow-y: auto;"></div>
    <button id="closeBanlistBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="map-modal hidden" id="mapModal">
  <div class="map-modal-content">
    <div id="map"></div>
    <button class="map-close-btn" id="closeMapBtn"><i data-lucide="x"></i></button>
  </div>
</div>

<button class="help-btn" id="helpBtn" type="button" title="Диагностика"><i data-lucide="shirt"></i></button>

<div class="help-modal hidden" id="helpModal">
  <div class="help-content">
    <h3>🛠 Диагностика</h3>
    <textarea id="errorLog" readonly></textarea>
    <button id="closeHelpBtn" type="button" class="btn-toggle">Закрыть</button>
  </div>
</div>

<script>
const debugLogs = [];
function addLog(msg) {
  const time = new Date().toLocaleTimeString();
  const formatted = `[${time}] ${msg}`;
  debugLogs.push(formatted);
  if (debugLogs.length > 100) debugLogs.shift();
  console.log(formatted);
}
window.addEventListener('error', function(e) { addLog(`КРИТИЧЕСКАЯ ОШИБКА JS: ${e.message} (${e.filename}:${e.lineno})`); });

const APPWRITE_ENDPOINT   = 'https://fra.cloud.appwrite.io/v1';

function safeParse(str) { try { return JSON.parse(str); } catch { return null; } }
function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function refreshIcons() { if (typeof lucide !== 'undefined' && lucide.createIcons) { try { lucide.createIcons(); } catch (e) {} } }
function isBanExpired(user) { if (!user || user.ban_type === 'forever') return false; if (user.ban_type !== 'day' && user.ban_type !== 'week') return false; const until = Number(user.ban_until || 0); return until ? Date.now() >= until : false; }
function isUserBannedNow(user) { if (!user) return false; if (user.ban_type === 'forever') return true; if (user.ban_type === 'day' || user.ban_type === 'week') return !isBanExpired(user); return user.is_banned === 'true'; }
function isAdmin() { return !!(currentUser && currentUser.is_admin === 'true'); }

function parseCoords(str) {
  if (!str || typeof str !== 'string') return null;
  const matches = str.match(/-?\d+(?:\.\d+)?/g);
  if (!matches || matches.length < 2) return null;
  let lat = parseFloat(matches[0]); let lng = parseFloat(matches[1]);
  if (isNaN(lat) || isNaN(lng)) return null;
  return `${lat},${lng}`; 
}

function updateAvatar() {

  } else {
    avatarBtn.classList.add('guest'); avatarBtn.innerText = '?'; banlistBtn.style.display = 'none';

}

function checkAuthBeforeAction(action) {

  if (isUserBannedNow(currentUser)) { alert('Вы забанены и не можете совершать действия.'); return; }
  action();
}

let startX = 0, startY = 0, isSwiping = false, swipeFromScroller = false;
document.addEventListener('touchstart', e => {
  swipeFromScroller = !!(e.target.closest('.photo-container') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('select') || e.target.closest('.detail-body'));
  startX = e.touches[0].clientX; startY = e.touches[0].clientY; isSwiping = true;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!isSwiping || swipeFromScroller) { isSwiping = false; return; }
  const diffX = startX - e.changedTouches[0].clientX; const diffY = startY - e.changedTouches[0].clientY;
  if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 70) { if (diffX > 0) goToQuests(); else goToMain(); }
  isSwiping = false;
}, { passive: true });

function goToQuests() { document.getElementById('page-main').style.transform = 'translateX(-100vw)'; document.getElementById('page-quests').style.transform = 'translateX(0)'; }

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function playSound() { if (!soundEnabled) return; try { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1); } catch (e) {} }

function updateMarkers() {
  addLog(`Обновление маркеров. Всего мест: ${places.length}`);
  if (!map) { addLog('ОШИБКА: Карта (map) не инициализирована!'); return; }
  markers.forEach(m => map.removeLayer(m)); markers = []; const bounds = []; let addedCount = 0;

  places.forEach(p => {
    if (p.is_archived === 'true' || p.is_banned === 'true') { addLog(`Пропущено "${p.name}" (архив/бан)`); return; }
    const parsed = parseCoords(p.coords);
    if (!parsed) { addLog(`ОШИБКА КООРДИНАТ: "${p.name}" -> "${p.coords}"`); return; }
    const [lat, lng] = parsed.split(',').map(Number);
    addLog(`✅ Маркер: "${p.name}" [${lat}, ${lng}]`);
    const m = L.marker([lat, lng]).addTo(map).bindPopup(`<b>${esc(p.name)}</b>`);
    markers.push(m); bounds.push([lat, lng]); addedCount++;
  });
  addLog(`Добавлено маркеров: ${addedCount}`);
  if (bounds.length > 0) { addLog('fitBounds'); map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 }); }
}

function openMapToPlace() {
  if (!currentDetailPlaceId) return;
  const p = places.find(x => x.id === currentDetailPlaceId); if (!p) return;
  const parsed = parseCoords(p.coords); if (!parsed) { alert('Нет координат.'); return; }
  document.getElementById('detailModal').classList.add('hidden'); document.getElementById('mapModal').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  if (!map) { map = L.map('map').setView([56.1463, 47.2481], 12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map); }
  setTimeout(() => { map.invalidateSize(); const [lat, lng] = parsed.split(',').map(Number); map.setView([lat, lng], 15); markers.forEach(m => { if (m.getLatLng().lat === lat && m.getLatLng().lng === lng) m.openPopup(); }); }, 150);
}

/* ЗАГРУЗКА ДАННЫХ */
async function loadData() {
  addLog('Загрузка из Appwrite...');
  try {
    const response = await databases.listDocuments(DATABASE_ID, COLLECTION_ID, [Query.limit(100)]);
    places = response.documents.filter(doc => doc.city !== 'USER_ACCOUNT').map(doc => ({ ...doc, id: doc.$id, comments: Array.isArray(doc.comments) ? doc.comments : [] }));
    statusEl.style.display = 'none'; addLog(`Загружено мест: ${places.length}`);
  } catch (e) { statusEl.textContent = 'Ошибка базы'; statusEl.className = 'status error'; addLog('ОШИБКА ЗАГРУЗКИ: ' + e.message); }
  render(); updateMarkers();
}

/* РЕНДЕР */
function getFilteredPlaces() {
  let list = places.filter(p => p.is_archived !== 'true' && p.is_banned !== 'true');
  if (searchQuery) list = list.filter(p => (p.name || '').toLowerCase().includes(searchQuery));
  if (currentTab === 'new') list = [...list].sort((a, b) => new Date(b.$createdAt || 0) - new Date(a.$createdAt || 0));
  else list = [...list].sort((a, b) => { const la = Number(a.likes || 0), lb = Number(b.likes || 0); if (lb !== la) return lb - la; const ra = Number(a.rating_sum || 0), rb = Number(b.rating_sum || 0); if (rb !== ra) return rb - ra; return new Date(b.$createdAt || 0) - new Date(a.$createdAt || 0); });
  return list;
}

function render() {
  const listEl = document.getElementById('placesList'); if (!listEl) return;
  const filtered = getFilteredPlaces();
  if (filtered.length === 0) { listEl.innerHTML = '<div class="empty">Пока ничего нет</div>'; refreshIcons(); return; }

  listEl.innerHTML = filtered.map(p => {
    const photoUrl = typeof p.photos === 'string' ? p.photos : (Array.isArray(p.photos) && p.photos[0] ? p.photos[0] : '');
    const canEdit = isAdmin() || (currentUser && p.author_id && p.author_id === currentUser.id);
    return `
    <div class="place-card" onclick="openPlaceDetail('${esc(p.id)}')">
      ${photoUrl ? `<div class="photo-container"><img src="${esc(photoUrl)}" class="photo-item" onerror="this.parentElement.style.display='none'"></div>` : ''}
      <div class="place-content">
        <h3>${esc(p.name)}</h3>
        <div class="author-badge" onclick="event.stopPropagation(); openUserInfo('${esc(p.author || 'Неизвестный').replace(/'/g, "\\'")}', '${esc(p.author_id || '0')}')">Добавил: ${esc(p.author || 'Неизвестный')}</div>
        <div class="desc">${esc(p.desc || '')}</div>
        <div style="font-size:12px; color:#00ffc8; font-weight:bold; display:flex; align-items:center; gap:5px; margin-top:10px;"><i data-lucide="info" style="width:14px;height:14px;"></i> Нажмите, чтобы узнать подробнее</div>
        ${canEdit ? `<div class="actions" onclick="event.stopPropagation();"><button class="btn-edit" onclick="editPlace('${esc(p.id)}')"><i data-lucide="edit-3" style="width:14px;height:14px;"></i> Редактировать</button><button class="btn-delete" onclick="deletePlace('${esc(p.id)}')"><i data-lucide="trash-2" style="width:14px;height:14px;"></i> Удалить</button></div>` : ''}
      </div>
    </div>`;
  }).join('');
  refreshIcons();
}

/* МОДАЛКА ПОДРОБНОСТЕЙ */
function openPlaceDetail(id) {
  const p = places.find(x => x.id === id); if (!p) return; currentDetailPlaceId = id;
  const photoUrl = typeof p.photos === 'string' ? p.photos : (Array.isArray(p.photos) && p.photos[0] ? p.photos[0] : '');
  
  const imgEl = document.getElementById('detailImg');
  const headerEl = document.getElementById('detailHeader');
  if (photoUrl) { imgEl.src = photoUrl; imgEl.style.display = 'block'; headerEl.style.display = 'flex'; } 
  else { imgEl.style.display = 'none'; headerEl.style.display = 'none'; }

  document.getElementById('detailTitle').innerText = p.name || 'Без названия';
  document.getElementById('detailAuthor').innerText = 'Добавил: ' + (p.author || 'Неизвестный');
  document.getElementById('detailDesc').innerText = p.desc || '';
  const coordsBox = document.getElementById('detailCoordsBox');
  if (p.coords) coordsBox.style.display = 'block'; else coordsBox.style.display = 'none';

  const commentsContainer = document.getElementById('detailCommentsSection');
  const commentsHtml = (p.comments || []).map((c, idx) => {
    const cText = typeof c === 'string' ? c : (c.text || 'Ошибка');
    const canDel = isAdmin() || (currentUser && p.author_id === currentUser.id);
    return `<div class="comment"><span>${esc(cText)}</span>${canDel ? `<button class="del-comment" onclick="deleteComment('${esc(p.id)}', ${idx})" title="Удалить"><i data-lucide="trash-2"></i></button>` : ''}</div>`;
  }).join('');

  commentsContainer.innerHTML = `
    <strong style="font-size:12px;color:var(--text-desc); text-transform:uppercase; letter-spacing:1px;">Комментарии (${(p.comments || []).length})</strong>
    <div style="margin-top:10px;">${commentsHtml || '<div style="color:var(--text-desc); font-size:14px;">Пока нет комментариев</div>'}</div>
    <div class="comment-form">
      <input type="text" id="c_detail" placeholder="Ваш комментарий..." maxlength="500" onkeydown="if(event.key==='Enter'){event.preventDefault();addComment('${esc(p.id)}')}">
      <button onclick="addComment('${esc(p.id)}')"><i data-lucide="send"></i></button>
    </div>`;

  document.getElementById('detailModal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; refreshIcons();
}
document.getElementById('closeDetailBtn').addEventListener('click', () => { document.getElementById('detailModal').classList.add('hidden'); document.body.style.overflow = ''; });

async function addComment(id) {
  checkAuthBeforeAction(async () => {
    const inp = document.getElementById('c_detail') || document.getElementById('c_' + id); if (!inp) return;
    const text = inp.value.trim(); if (!text) return;
    const p = places.find(x => x.id === id); if (!p) return;
    const comments = Array.isArray(p.comments) ? [...p.comments] : [];
    comments.push(`${currentUser.nickname}: ${text}`); 
    try {
      await databases.updateDocument(DATABASE_ID, COLLECTION_ID, id, { comments }); p.comments = comments; inp.value = ''; 
      if (currentDetailPlaceId === id) openPlaceDetail(id); else render(); render(); 
    } catch (e) { addLog('Ошибка добавления комментария: ' + e.message); alert('Ошибка комментария: ' + e.message); }
  });
}

/* ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ */
function resetAddForm() {
  editingPlaceId = null; document.getElementById('inName').value = ''; document.getElementById('inDesc').value = ''; document.getElementById('inPhotos').value = ''; document.getElementById('inCoords').value = ''; document.getElementById('inCity').value = 'Чебоксары';
  document.getElementById('saveBtn').innerHTML = '<i data-lucide="save"></i> Сохранить'; document.getElementById('toggleForm').innerHTML = '<i data-lucide="plus-circle"></i> Добавить место'; refreshIcons();
}
function editPlace(id) {
  const p = places.find(x => x.id === id); if (!p) return; editingPlaceId = id;
  document.getElementById('inName').value = p.name || ''; document.getElementById('inDesc').value = p.desc || '';
  document.getElementById('inPhotos').value = typeof p.photos === 'string' ? p.photos : (Array.isArray(p.photos) ? (p.photos[0] || '') : '');
  document.getElementById('inCoords').value = p.coords || ''; document.getElementById('inCity').value = ['Чебоксары','Новочебоксарск','Чувашия'].includes(p.city) ? p.city : 'Чебоксары';
  document.getElementById('addForm').classList.remove('hidden'); document.getElementById('toggleForm').innerHTML = '<i data-lucide="x"></i> Отменить редактирование'; document.getElementById('saveBtn').innerHTML = '<i data-lucide="save"></i> Обновить';
  document.getElementById('detailModal').classList.add('hidden'); document.body.style.overflow = ''; refreshIcons(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('toggleForm').addEventListener('click', () => {
  const form = document.getElementById('addForm');
  if (form.classList.contains('hidden')) { form.classList.remove('hidden'); resetAddForm(); form.classList.remove('hidden'); }
  else { form.classList.add('hidden'); resetAddForm(); }
});

document.getElementById('saveBtn').addEventListener('click', () => {
  checkAuthBeforeAction(async () => {
    const name = document.getElementById('inName').value.trim(); const desc = document.getElementById('inDesc').value.trim();
    if (!name || !desc) return alert('Заполните поля!');
    const photoLink = document.getElementById('inPhotos').value.trim(); const rawCoords = document.getElementById('inCoords').value.trim();
    let finalCoords = '';
    if (rawCoords) { const parsed = parseCoords(rawCoords); if (!parsed) return alert('Некорректные координаты. Вставьте координаты из Яндекс.Карт (например: 56.152594, 47.207843)'); finalCoords = parsed; }
    // ИСПРАВЛЕНО: сохраняем строку, а не массив
    const data = { name, desc, city: document.getElementById('inCity').value, coords: finalCoords, photos: photoLink ? photoLink : "", author: currentUser.nickname, author_id: currentUser.id || '0', is_archived: 'false' };
    try {
      if (editingPlaceId) await databases.updateDocument(DATABASE_ID, COLLECTION_ID, editingPlaceId, data);
      else { data.likes = '0'; data.rating_sum = '0'; data.rating_count = '0'; data.comments = []; data.is_banned = 'false'; await databases.createDocument(DATABASE_ID, COLLECTION_ID, ID.unique(), data); }
      document.getElementById('addForm').classList.add('hidden'); resetAddForm(); loadData();
    } catch (e) { addLog('Ошибка сохранения: ' + e.message); alert('Ошибка: ' + e.message); }
  });
});

async function deletePlace(id) {
  if (!confirm('Удалить это место?')) return;
  checkAuthBeforeAction(async () => {
    const p = places.find(x => x.id === id); if (!p) return;
    const canEdit = isAdmin() || (currentUser && p.author_id === currentUser.id); if (!canEdit) { alert('Нет прав'); return; }
    try { await databases.deleteDocument(DATABASE_ID, COLLECTION_ID, id); document.getElementById('detailModal').classList.add('hidden'); document.body.style.overflow = ''; loadData(); } catch (e) { addLog('Ошибка удаления: ' + e.message); alert('Ошибка удаления: ' + e.message); }
  });
}

async function deleteComment(id, index) {
  const p = places.find(x => x.id === id); if (!p) return;
  const canDel = isAdmin() || (currentUser && p.author_id === currentUser.id); if (!canDel) { alert('Нет прав'); return; }
  const comments = Array.isArray(p.comments) ? [...p.comments] : []; comments.splice(index, 1);
  try { await databases.updateDocument(DATABASE_ID, COLLECTION_ID, id, { comments }); p.comments = comments; if (currentDetailPlaceId === id) openPlaceDetail(id); else render(); render(); } catch (e) { addLog('Ошибка удаления комментария: ' + e.message); alert('Ошибка удаления: ' + e.message); }
}

/* ИНИЦИАЛИЗАЦИЯ */
if (isLightTheme) { document.body.classList.add('light-theme'); document.getElementById('themeToggle').innerHTML = '<i data-lucide="sun"></i>'; }
const savedOpacity = localStorage.getItem('cheb_glass_opacity') || '0.6'; document.documentElement.style.setProperty('--glass-opacity', savedOpacity); document.getElementById('glassSlider').value = savedOpacity;
questsBtn.style.display = 'flex'; updateAvatar(); loadData(); window.addEventListener('load', () => refreshIcons());
</script>
