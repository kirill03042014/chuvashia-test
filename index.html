<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>КРУТЫЕ МЕСТА ЧУВАШИИ</title>

<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffc8">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@latest" defer></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap');
  
  :root {
    --bg-body: #05070a;
    --text-main: #e2e8f0;
    --text-title: #ffffff;
    --text-desc: #94a3b8;
    --glass-opacity: 0.6; 
    --glass-blur: 40px;
    --glass-bg: rgba(20, 25, 35, var(--glass-opacity));
    --glass-border: rgba(255, 255, 255, 0.25);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    --input-bg: rgba(0, 0, 0, 0.4);
    --btn-bg: rgba(30, 40, 50, 0.5);
  }

  body.light-theme {
    --bg-body: #e2e8f0;
    --text-main: #1e293b;
    --text-title: #0f172a;
    --text-desc: #475569;
    --glass-bg: rgba(255, 255, 255, var(--glass-opacity));
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-highlight: rgba(255, 255, 255, 0.8);
    --input-bg: rgba(255, 255, 255, 0.6);
    --btn-bg: rgba(255, 255, 255, 0.9);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { 
    font-family: 'Rubik', sans-serif; 
    background: var(--bg-body); 
    color: var(--text-main); 
    font-size: 16px; 
    transition: background 0.4s, color 0.4s; 
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(0, 255, 200, 0.2) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(255, 0, 102, 0.2) 0%, transparent 40%);
    background-attachment: fixed;
    padding-bottom: 80px;
  }
  
  .container { max-width: 920px; margin: 0 auto; padding: 20px 15px; }
  
  .top-bar { display: flex; justify-content: flex-start; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  
  .icon-btn { 
    background: var(--glass-bg); border: 1px solid var(--glass-border); 
    color: var(--text-main); width: 45px; height: 45px; 
    display: flex; align-items: center; justify-content: center; 
    cursor: pointer; border-radius: 50%; 
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 4px 15px rgba(0,0,0,0.3);
    transition: all 0.3s;
  }
  .icon-btn:hover { background: var(--input-bg); }
  .icon-btn svg { width: 22px; height: 22px; }

  .avatar { 
    width: 45px; height: 45px; border-radius: 50%; background: #00ffc8; color: #0a0c10; 
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; 
    cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 15px rgba(0,255,200,0.6); margin-left: auto;
  }
  .avatar.guest { background: #475569; color: #fff; border-color: #94a3b8; box-shadow: none; }

  h1 { font-family: 'Oswald', sans-serif; font-size: 2.4em; text-transform: uppercase; text-align: center; color: var(--text-title); text-shadow: 0 0 20px rgba(0,255,200,0.4); margin-bottom: 5px; letter-spacing: 1px; }
  .subtitle { text-align: center; font-size: 12px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-desc); margin-bottom: 25px; }
  
  .panel, .place-card, .tabs button, .help-content, .profile-content, .settings-content, .about-content, .user-card, .map-modal-content { 
    background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 10px 40px rgba(0,0,0,0.4);
    transition: background 0.4s, border 0.4s; border-radius: 20px;
  }
  .panel { padding: 15px; margin-bottom: 15px; }
  
  input, textarea, select { font-family: inherit; font-size: 15px; width: 100%; padding: 14px; border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 10px; background: var(--input-bg); color: var(--text-main); -webkit-appearance: none; transition: all 0.3s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #00ffc8; box-shadow: 0 0 15px rgba(0,255,200,0.3); }
  textarea { resize: vertical; min-height: 70px; }
  
  button { background: var(--btn-bg); color: #00ffc8; border: 1px solid rgba(0,255,200,0.4); border-radius: 12px; font-weight: 600; font-family: 'Oswald', sans-serif; text-transform: uppercase; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; width: 100%; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
  button:active { transform: scale(0.96); }
  button svg { width: 18px; height: 18px; }
  
  .btn-toggle { background: transparent; color: var(--text-desc); border: 1px dashed var(--glass-border); }
  label { font-family: 'Oswald', sans-serif; font-size: 11px; text-transform: uppercase; color: var(--text-desc); display: block; margin-bottom: 6px; letter-spacing: 1px; }
  
  .place-card { border-left: 4px solid #00ffc8; margin-bottom: 20px; overflow: hidden; }
  .photo-container { width: 100%; height: 220px; background: #000; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; border-bottom: 1px solid var(--glass-border); }
  .photo-container::-webkit-scrollbar { display: none; }
  .photo-item { flex: 0 0 100%; scroll-snap-align: start; height: 100%; object-fit: cover; }
  .place-content { padding: 20px; }
  .place-card h3 { font-family: 'Oswald', sans-serif; font-size: 1.5em; text-transform: uppercase; color: var(--text-title); margin-bottom: 5px; }
  
  .author-badge { display: inline-block; background: rgba(0,255,200,0.1); color: #00ffc8; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 10px; cursor: pointer; border: 1px solid rgba(0,255,200,0.3); }
  .desc { color: var(--text-desc); font-size: 15px; margin-bottom: 15px; line-height: 1.5; }
  
  .comments { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--glass-border); }
  .comment { background: var(--input-bg); padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--glass-border); }
  .comment-author { font-weight: bold; color: #00ffc8; margin-right: 5px; font-size: 12px; cursor: pointer; }
  .comment-form { display: flex; gap: 8px; margin-top: 10px; }
  .comment-form input { margin: 0; padding: 12px; }
  .comment-form button { width: auto; padding: 12px 20px; margin: 0; }
  
  .empty { text-align: center; padding: 40px; color: var(--text-desc); text-transform: uppercase; font-family: 'Oswald'; font-size: 1.2em; letter-spacing: 2px; }
  .hidden { display: none !important; }
  
  .status { text-align: center; font-family: 'Oswald'; font-size: 13px; padding: 10px; margin-bottom: 15px; border-radius: 8px; text-transform: uppercase; backdrop-filter: blur(5px); }
  .status.ok { color: #00ffc8; background: rgba(0,255,200,0.1); } 
  .status.error { color: #ff0066; background: rgba(255,0,102,0.1); }

  /* МОДАЛЬНЫЕ ОКНА */
  .help-modal, .profile-modal, .settings-modal, .about-modal, .banlist-modal, .user-info-modal, .map-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1001; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .help-content, .profile-content, .settings-content, .about-content, .banlist-content, .user-info-content { padding: 25px; max-width: 450px; width: 100%; color: var(--text-main); }
  
  /* КАРТА НА ВЕСЬ ЭКРАН */
  .map-modal-content { width: 100%; height: 100%; padding: 0; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  #map { flex-grow: 1; width: 100%; border-radius: 20px; z-index: 1; }
  .map-close-btn { position: absolute; top: 15px; right: 15px; z-index: 1000; width: 50px; height: 50px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 50%; color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: var(--glass-blur); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

  h3 { color: var(--text-title); margin-bottom: 20px; text-align: center; font-family: 'Oswald'; text-transform: uppercase; letter-spacing: 1px; }
  .help-content textarea { width: 100%; height: 150px; margin-bottom: 15px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--glass-border); padding: 12px; font-size: 12px; border-radius: 8px; }

  .user-card { padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .user-card button { width: auto; padding: 6px 12px; font-size: 12px; }

  .help-btn { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: #ff0066; color: #fff; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(255,0,102,0.5); z-index: 1000; cursor: pointer; backdrop-filter: blur(5px); }
  .help-btn svg { width: 28px; height: 28px; }
  
  .form-row { display: flex; gap: 10px; }
  .form-row > * { flex: 1; }
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <button class="icon-btn" id="mapBtn" title="Открыть карту"><i data-lucide="map"></i></button>
    <button class="icon-btn" id="installBtn" title="Установить приложение" style="display:none;"><i data-lucide="download"></i></button>
    <button class="icon-btn" id="settingsBtn" title="Настройки"><i data-lucide="settings"></i></button>
    <button class="icon-btn" id="themeToggle" title="Сменить тему"><i data-lucide="moon"></i></button>
    <button class="icon-btn" id="banlistBtn" title="Забаненные" style="display:none;"><i data-lucide="shield-alert"></i></button>
    
    <div class="avatar guest" id="avatarBtn">?</div>
  </div>

  <h1>Крутые места Чувашии</h1>
  <div class="subtitle">Чебоксары · Новочебоксарск · Чувашия</div>

  <div id="status" class="status loading">Загрузка...</div>
  <div class="tabs" id="tabs">
    <button class="active" data-tab="popular"><i data-lucide="flame"></i> Популярное</button>
    <button data-tab="new"><i data-lucide="sparkles"></i> Новое</button>
  </div>
  <div class="panel">
    <input type="text" id="searchInput" placeholder="Поиск по названию...">
  </div>

  <div class="panel">
    <button class="btn-toggle" id="toggleForm" type="button"><i data-lucide="plus-circle"></i> Добавить место</button>
    <div id="addForm" class="hidden" style="margin-top:15px;">
      <label>Название *</label><input type="text" id="inName" placeholder="Название">
      <label>Описание *</label><textarea id="inDesc" placeholder="Описание"></textarea>
      <label>Ссылка на фото</label><input type="url" id="inPhotos" placeholder="https://.../image.jpg">
      <div class="form-row">
        <div><label>Город</label><select id="inCity"><option>Чебоксары</option><option>Новочебоксарск</option><option>Чувашия</option></select></div>
        <div><label>Координаты</label><input type="text" id="inCoords" placeholder="56.146, 47.248"></div>
      </div>
      <button id="saveBtn" type="button"><i data-lucide="save"></i> Сохранить</button>
    </div>
  </div>

  <div id="placesList"></div>
</div>

<!-- МОДАЛЬНЫЕ ОКНА -->
<div class="settings-modal hidden" id="settingsModal">
  <div class="settings-content">
    <h3>Настройки</h3>
    <label>Прозрачность стекла</label>
    <input type="range" id="glassSlider" min="0.1" max="0.95" step="0.05" value="0.6">
    <label style="margin-top:15px;">Звук</label>
    <div style="display:flex; gap:10px;">
      <button id="soundOnBtn" class="btn-toggle" style="flex:1; border-color:#00ffc8;">Вкл</button>
      <button id="soundOffBtn" class="btn-toggle" style="flex:1; border-color:#ff0066; color:#ff0066;">Выкл</button>
    </div>
    <button id="closeSettingsBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="profile-modal hidden" id="profileModal">
  <div class="profile-content">
    <h3 id="profileTitle">Вход</h3>
    <div id="loginSection">
      <input type="text" id="loginNickname" placeholder="Ник">
      <input type="password" id="loginPassword" placeholder="Пароль">
      <button id="loginBtn" type="button">Войти</button>
      <p style="text-align:center; margin-top:15px; font-size:12px; color:var(--text-desc);">Нет аккаунта? <a href="#" id="showRegisterLink" style="color:#00ffc8;">Регистрация</a></p>
    </div>
    <div id="registerSection" class="hidden">
      <input type="text" id="regNickname" placeholder="Придумайте ник">
      <input type="password" id="regPassword" placeholder="Придумайте пароль">
      <button id="registerBtn" type="button">Зарегистрироваться</button>
      <p style="text-align:center; margin-top:15px; font-size:12px; color:var(--text-desc);">Уже есть аккаунт? <a href="#" id="showLoginLink" style="color:#00ffc8;">Войти</a></p>
    </div>
    <div id="loggedInSection" class="hidden">
      <p id="userGreeting" style="text-align:center; margin-bottom:20px; font-weight:bold; color:#00ffc8;"></p>
      <button id="logoutBtn" type="button" style="border-color: #ff0066; color: #ff0066;">Выйти</button>
    </div>
    <button id="closeProfileBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="user-info-modal hidden" id="userInfoModal">
  <div class="user-info-content">
    <h3 id="infoNickname">Ник</h3>
    <p id="infoStatus" style="text-align:center; margin-bottom:20px;"></p>
    <div id="adminBanControls" class="hidden">
      <p style="text-align:center; margin-bottom:10px; font-size:14px; color:#ff0066;">Модерация:</p>
      <div style="display:flex; flex-direction:column; gap:5px;">
        <button onclick="banUser('day')" class="btn-toggle" style="color:#ffc800; border-color:#ffc800;">Забанить на 1 день</button>
        <button onclick="banUser('week')" class="btn-toggle" style="color:#ff9900; border-color:#ff9900;">Забанить на 1 неделю</button>
        <button onclick="banUser('forever')" class="btn-toggle" style="color:#ff0066; border-color:#ff0066;">Забанить навсегда</button>
      </div>
    </div>
    <button id="closeUserInfoBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="banlist-modal hidden" id="banlistModal">
  <div class="banlist-content">
    <h3>Забаненные</h3>
    <div id="banlistItems" style="max-height: 300px; overflow-y: auto;"></div>
    <button id="closeBanlistBtn" type="button" class="btn-toggle" style="margin-top:20px;">Закрыть</button>
  </div>
</div>

<!-- ОКНО КАРТЫ НА ВЕСЬ ЭКРАН -->
<div class="map-modal hidden" id="mapModal">
  <div class="map-modal-content">
    <div id="map"></div>
    <button class="map-close-btn" id="closeMapBtn"><i data-lucide="x"></i></button>
  </div>
</div>

<button class="help-btn" id="helpBtn" type="button">
  <i data-lucide="shirt"></i>
</button>

<div class="help-modal hidden" id="helpModal">
  <div class="help-content">
    <h3>Ошибка</h3>
    <textarea id="errorLog" readonly></textarea>
    <button id="closeHelpBtn" type="button" class="btn-toggle">Закрыть</button>
  </div>
</div>

<script>
const APPWRITE_ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
const APPWRITE_PROJECT_ID = '6af75290002021ce6c30';
const DATABASE_ID = '6af752b800204637c982'; 
const COLLECTION_ID = '6af754b70031b4620e57'; 

const { Client, Databases, ID, Query } = Appwrite;
const client = new Client().setEndpoint(APPWRITE_ENDPOINT).setProject(APPWRITE_PROJECT_ID);
const databases = new Databases(client);

const ADMIN_PASSWORD = 'SmirnovKirill03@inbox.ry';

let map = null;
let markers = [];
let places = [];
let soundEnabled = localStorage.getItem('cheb_sound') !== 'false';
let isLightTheme = localStorage.getItem('cheb_theme') === 'light';
let currentUser = JSON.parse(localStorage.getItem('cheb_current_user') || 'null');
let selectedUserForBan = null; 
let lastError = 'Ошибок не было.';
let editingPlaceId = null; 

const statusEl = document.getElementById('status');
const avatarBtn = document.getElementById('avatarBtn');
const banlistBtn = document.getElementById('banlistBtn');

function isAdmin() { return currentUser && currentUser.is_admin === 'true'; }

function updateAvatar() {
  if (currentUser) {
    avatarBtn.classList.remove('guest');
    avatarBtn.innerText = currentUser.nickname.charAt(0).toUpperCase();
    if (isAdmin()) banlistBtn.style.display = 'flex';
  } else {
    avatarBtn.classList.add('guest');
    avatarBtn.innerText = '?';
    banlistBtn.style.display = 'none';
  }
}

function checkAuthBeforeAction(action) {
  if (!currentUser) {
    alert('Войдите в профиль, чтобы совершить это действие!');
    document.getElementById('profileModal').classList.remove('hidden');
    return;
  }
  if (currentUser.is_banned === 'true' || currentUser.ban_type === 'forever') {
    alert('Вы забанены и не можете совершать действия.');
    return;
  }
  action();
}

// === ЗВУК ===
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function playSound() {
  if (!soundEnabled) return;
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}
document.addEventListener('click', (e) => { if (e.target.closest('button')) playSound(); });

// === УСТАНОВКА ПРИЛОЖЕНИЯ ===
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('cheb_app_installed')) document.getElementById('installBtn').style.display = 'flex';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
    localStorage.setItem('cheb_app_installed', 'true');
  }
});
window.addEventListener('appinstalled', () => {
  document.getElementById('installBtn').style.display = 'none';
  localStorage.setItem('cheb_app_installed', 'true');
});
if (localStorage.getItem('cheb_app_installed')) document.getElementById('installBtn').style.display = 'none';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// === КАРТА ===
document.getElementById('mapBtn').addEventListener('click', () => {
  document.getElementById('mapModal').classList.remove('hidden');
  if (!map) {
    map = L.map('map').setView([56.1463, 47.2481], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
  }
  setTimeout(() => { map.invalidateSize(); updateMarkers(); }, 100);
});

document.getElementById('closeMapBtn').addEventListener('click', () => {
  document.getElementById('mapModal').classList.add('hidden');
});

function updateMarkers() {
  if (!map) return;
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  places.forEach(p => {
    if (p.coords && p.coords.includes(',')) {
      const [lat, lng] = p.coords.split(',').map(Number);
      if (!isNaN(lat) && !isNaN(lng)) {
        const m = L.marker([lat, lng]).addTo(map).bindPopup(p.name || '');
        markers.push(m);
      }
    }
  });
}

// === АВТОРИЗАЦИЯ ===
document.getElementById('avatarBtn').addEventListener('click', () => {
  document.getElementById('profileModal').classList.remove('hidden');
  if (currentUser) {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('registerSection').classList.add('hidden');
    document.getElementById('loggedInSection').classList.remove('hidden');
    document.getElementById('userGreeting').innerText = "Привет, " + currentUser.nickname;
  } else {
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('registerSection').classList.add('hidden');
    document.getElementById('loggedInSection').classList.add('hidden');
  }
});
document.getElementById('showRegisterLink').addEventListener('click', (e) => { e.preventDefault(); document.getElementById('loginSection').classList.add('hidden'); document.getElementById('registerSection').classList.remove('hidden'); });
document.getElementById('showLoginLink').addEventListener('click', (e) => { e.preventDefault(); document.getElementById('loginSection').classList.remove('hidden'); document.getElementById('registerSection').classList.add('hidden'); });
document.getElementById('closeProfileBtn').addEventListener('click', () => { document.getElementById('profileModal').classList.add('hidden'); });

// ВХОД
document.getElementById('loginBtn').addEventListener('click', async () => {
  const nick = document.getElementById('loginNickname').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if (!nick || !pass) return;

  if (pass === ADMIN_PASSWORD) {
    currentUser = { nickname: 'Админ', is_admin: 'true', is_banned: 'false', id: 'admin' };
    localStorage.setItem('cheb_current_user', JSON.stringify(currentUser));
    updateAvatar(); document.getElementById('profileModal').classList.add('hidden');
    alert('Добро пожаловать, Админ!'); render(); return;
  }

  try {
    const res = await databases.listDocuments(DATABASE_ID, COLLECTION_ID, [Query.equal('city', 'USER_ACCOUNT'), Query.equal('name', nick)]);
    if (res.documents.length === 0) { alert('Пользователь не найден!'); return; }
    const user = res.documents[0];
    if (user.desc !== pass) { alert('Неверный пароль!'); return; }
    if (user.ban_type === 'forever') { alert('Вы забанены навсегда!'); return; }
    
    currentUser = { nickname: user.name, is_admin: 'false', id: user.$id, is_banned: user.is_banned || 'false', ban_type: user.ban_type || 'none' };
    localStorage.setItem('cheb_current_user', JSON.stringify(currentUser));
    updateAvatar(); document.getElementById('profileModal').classList.add('hidden');
    alert('С возвращением, ' + user.name); render();
  } catch(e) { alert('Ошибка входа'); }
});

// РЕГИСТРАЦИЯ
document.getElementById('registerBtn').addEventListener('click', async () => {
  const nick = document.getElementById('regNickname').value.trim();
  const pass = document.getElementById('regPassword').value;
  if (!nick || !pass) return;

  const deviceId = localStorage.getItem('cheb_device_id');
  if (deviceId) { alert('На этом устройстве уже есть аккаунт!'); return; }
  if (pass === ADMIN_PASSWORD) { alert('Этот пароль занят!'); return; }

  try {
    const res = await databases.listDocuments(DATABASE_ID, COLLECTION_ID, [Query.equal('city', 'USER_ACCOUNT'), Query.equal('name', nick)]);
    if (res.documents.length > 0) { alert('Ник занят!'); return; }

    const newUser = await databases.createDocument(DATABASE_ID, COLLECTION_ID, ID.unique(), {
      name: nick, desc: pass, city: 'USER_ACCOUNT', category: 'user', guard: 'false', is_banned: 'false', ban_type: 'none', ban_until: '0'
    });
    
    localStorage.setItem('cheb_device_id', ID.unique());
    currentUser = { nickname: nick, is_admin: 'false', id: newUser.$id, is_banned: 'false', ban_type: 'none' };
    localStorage.setItem('cheb_current_user', JSON.stringify(currentUser));
    updateAvatar(); document.getElementById('profileModal').classList.add('hidden');
    alert('Успешная регистрация!'); render();
  } catch(e) { alert('Ошибка регистрации'); }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  currentUser = null; localStorage.removeItem('cheb_current_user');
  updateAvatar(); document.getElementById('profileModal').classList.add('hidden'); render();
});

// === МОДЕРАЦИЯ ===
function openUserInfo(nickname, userId) {
  if (currentUser && currentUser.id === userId) {
    alert('Вы не можете забанить самого себя!');
    return;
  }
  selectedUserForBan = userId;
  document.getElementById('infoNickname').innerText = nickname;
  if (isAdmin() && userId && userId !== '0') document.getElementById('adminBanControls').classList.remove('hidden');
  else document.getElementById('adminBanControls').classList.add('hidden');
  document.getElementById('userInfoModal').classList.remove('hidden');
}
document.getElementById('closeUserInfoBtn').addEventListener('click', () => { document.getElementById('userInfoModal').classList.add('hidden'); });

async function banUser(type) {
  if (!isAdmin() || !selectedUserForBan) return;
  let banUntil = '0';
  if (type === 'day') banUntil = Date.now() + 86400000;
  if (type === 'week') banUntil = Date.now() + 604800000;

  try {
    await databases.updateDocument(DATABASE_ID, COLLECTION_ID, selectedUserForBan, { is_banned: 'true', ban_type: type, ban_until: String(banUntil) });
    alert('Пользователь забанен!'); document.getElementById('userInfoModal').classList.add('hidden'); render();
  } catch(e) { alert('Ошибка бана: ' + e.message); }
}

document.getElementById('banlistBtn').addEventListener('click', async () => {
  if (!isAdmin()) return;
  document.getElementById('banlistModal').classList.remove('hidden');
  const container = document.getElementById('banlistItems'); container.innerHTML = 'Загрузка...';
  
  try {
    const res = await databases.listDocuments(DATABASE_ID, COLLECTION_ID, [Query.equal('city', 'USER_ACCOUNT')]);
    const banned = res.documents.filter(u => u.ban_type === 'forever');
    if (banned.length === 0) container.innerHTML = '<p style="text-align:center; color:var(--text-desc);">Нет забаненных</p>';
    else container.innerHTML = banned.map(u => `<div class="user-card"><span>${u.name}</span><button onclick="unbanUser('${u.$id}')" style="border-color:#00ffc8; color:#00ffc8;">Разбанить</button></div>`).join('');
  } catch(e) { container.innerHTML = 'Ошибка загрузки'; }
});
document.getElementById('closeBanlistBtn').addEventListener('click', () => { document.getElementById('banlistModal').classList.add('hidden'); });

async function unbanUser(userId) {
  if (!isAdmin()) return;
  try {
    await databases.updateDocument(DATABASE_ID, COLLECTION_ID, userId, { is_banned: 'false', ban_type: 'none', ban_until: '0' });
    alert('Разбанен!'); document.getElementById('banlistBtn').click();
  } catch(e) { alert('Ошибка'); }
}

// === НАСТРОЙКИ ===
document.getElementById('settingsBtn').addEventListener('click', () => document.getElementById('settingsModal').classList.remove('hidden'));
document.getElementById('closeSettingsBtn').addEventListener('click', () => document.getElementById('settingsModal').classList.add('hidden'));
document.getElementById('glassSlider').addEventListener('input', (e) => { document.documentElement.style.setProperty('--glass-opacity', e.target.value); localStorage.setItem('cheb_glass_opacity', e.target.value); });
document.getElementById('soundOnBtn').addEventListener('click', () => { soundEnabled = true; localStorage.setItem('cheb_sound', 'true'); playSound(); });
document.getElementById('soundOffBtn').addEventListener('click', () => { soundEnabled = false; localStorage.setItem('cheb_sound', 'false'); });
document.getElementById('themeToggle').addEventListener('click', () => {
  isLightTheme = !isLightTheme;
  if (isLightTheme) { document.body.classList.add('light-theme'); document.getElementById('themeToggle').innerHTML = '<i data-lucide="sun"></i>'; localStorage.setItem('cheb_theme', 'light'); }
  else { document.body.classList.remove('light-theme'); document.getElementById('themeToggle').innerHTML = '<i data-lucide="moon"></i>'; localStorage.setItem('cheb_theme', 'dark'); }
  lucide.createIcons(); playSound();
});

// === ОШИБКИ ===
document.getElementById('helpBtn').addEventListener('click', () => {
  document.getElementById('errorLog').value = lastError;
  document.getElementById('helpModal').classList.remove('hidden');
});
document.getElementById('closeHelpBtn').addEventListener('click', () => document.getElementById('helpModal').classList.add('hidden'));

// === ВКЛАДКИ ===
document.getElementById('tabs').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
};

// === ЗАГРУЗКА И РЕНДЕР ===
async function loadData() {
  try {
    const response = await databases.listDocuments(DATABASE_ID, COLLECTION_ID);
    places = response.documents.filter(doc => doc.city !== 'USER_ACCOUNT').map(doc => ({ ...doc, id: doc.$id }));
    document.getElementById('status').style.display = 'none';
  } catch(e) { 
    document.getElementById('status').textContent = 'Ошибка базы'; document.getElementById('status').style.color = '#ff0066';
    lastError = e.message;
  }
  render();
  updateMarkers();
}

function render() {
  const list = document.getElementById('placesList');
  if (!list) return;

  const activeTab = document.querySelector('#tabs button.active').dataset.tab;
  let filtered = places.filter(p => p.is_archived !== 'true');

  list.innerHTML = filtered.map(p => {
    let photoUrl = '';
    if (p.photos && Array.isArray(p.photos) && p.photos.length > 0) photoUrl = p.photos[0];
    else if (p.photos && typeof p.photos === 'string') photoUrl = p.photos;

    const canEdit = isAdmin() || (currentUser && p.author_id === currentUser.id);

    return `
    <div class="place-card">
      ${photoUrl ? `<div class="photo-container"><img src="${photoUrl}" class="photo-item" onerror="this.style.display='none'"></div>` : ''}
      <div class="place-content">
        <h3>${p.name}</h3>
        <div class="author-badge" onclick="openUserInfo('${p.author || 'Неизвестный'}', '${p.author_id || '0'}')">Добавил: ${p.author || 'Неизвестный'}</div>
        <div class="desc">${p.desc || ''}</div>
        
        <div class="actions" style="display:${canEdit ? 'flex' : 'none'}; margin-bottom:10px; gap:5px;">
          <button class="btn-toggle" onclick="editPlace('${p.id}')" style="width:auto; padding:5px 10px; font-size:12px;">✏️ Ред.</button>
        </div>

        <div class="comments">
          <strong style="font-size:12px;color:var(--text-desc);">КОММЕНТАРИИ (${(p.comments || []).length})</strong>
          ${(p.comments || []).map(c => `<div class="comment"><span><b style="color:#00ffc8;">${p.author || 'Гость'}:</b> ${c}</span></div>`).join('')}
          <div class="comment-form">
            <input type="text" id="c_${p.id}" placeholder="Комментарий..." onkeydown="if(event.key==='Enter') addComment('${p.id}')">
            <button onclick="addComment('${p.id}')"><i data-lucide="send"></i></button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

// === ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ / КОММЕНТАРИИ ===
function editPlace(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  editingPlaceId = id;
  document.getElementById('inName').value = p.name || '';
  document.getElementById('inDesc').value = p.desc || '';
  document.getElementById('inPhotos').value = p.photos ? (Array.isArray(p.photos) ? p.photos[0] : p.photos) : '';
  document.getElementById('inCoords').value = p.coords || '';
  document.getElementById('addForm').classList.remove('hidden');
  document.getElementById('toggleForm').innerText = 'Редактирование...';
  document.getElementById('saveBtn').innerHTML = 'Обновить';
  window.scrollTo(0,0);
}

document.getElementById('toggleForm').addEventListener('click', () => {
  const form = document.getElementById('addForm');
  if (form.classList.contains('hidden')) {
    form.classList.remove('hidden');
    editingPlaceId = null;
    document.getElementById('saveBtn').innerHTML = '<i data-lucide="save"></i> Сохранить';
    lucide.createIcons();
  } else {
    form.classList.add('hidden');
    document.getElementById('toggleForm').innerText = 'Добавить место';
  }
});

document.getElementById('saveBtn').addEventListener('click', () => {
  checkAuthBeforeAction(async () => {
    const name = document.getElementById('inName').value.trim();
    const desc = document.getElementById('inDesc').value.trim();
    if (!name || !desc) return alert('Заполните поля!');
    
    const photoLink = document.getElementById('inPhotos').value.trim();
    
    const data = {
      name: name, desc: desc,
      city: document.getElementById('inCity').value,
      coords: document.getElementById('inCoords').value.trim(),
      photos: photoLink ? [photoLink] : [],
      author: currentUser.nickname,
      author_id: currentUser.id || '0'
    };

    try {
      if (editingPlaceId) {
        await databases.updateDocument(DATABASE_ID, COLLECTION_ID, editingPlaceId, data);
      } else {
        data.likes = "0"; data.rating_sum = "0"; data.rating_count = "0"; data.comments = []; data.is_banned = "false"; data.is_archived = "false";
        await databases.createDocument(DATABASE_ID, COLLECTION_ID, ID.unique(), data);
      }
      document.getElementById('addForm').classList.add('hidden');
      document.getElementById('toggleForm').innerText = 'Добавить место';
      loadData();
    } catch(e) { alert('Ошибка: ' + e.message); }
  });
});

async function addComment(id) {
  checkAuthBeforeAction(async () => {
    const inp = document.getElementById('c_' + id);
    const text = inp.value.trim();
    if (!text) return;
    const p = places.find(x => x.id === id);
    if (!p) return;
    p.comments = p.comments || [];
    p.comments.push(text);
    try {
      await databases.updateDocument(DATABASE_ID, COLLECTION_ID, id, { comments: p.comments });
      render();
    } catch(e) { alert('Ошибка комментария: ' + e.message); }
  });
}

// === ИНИЦИАЛИЗАЦИЯ ===
if (isLightTheme) document.body.classList.add('light-theme');
const savedOpacity = localStorage.getItem('cheb_glass_opacity') || '0.6';
document.documentElement.style.setProperty('--glass-opacity', savedOpacity);
document.getElementById('glassSlider').value = savedOpacity;

updateAvatar();
loadData();
</script>
</body>
</html>
